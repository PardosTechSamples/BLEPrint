[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bleprint"
version = "0.2.1"
description = "Open-source batch label printer for Nelko P21 and Supvan E10 BLE label printers (unaffiliated)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PyQt6>=6.6",
    "bleak>=0.22",
    "pillow>=10.0",
    "segno>=1.5",
]

[project.urls]
Homepage = "https://github.com/PardosTechSamples/BLEPrint"
Issues = "https://github.com/PardosTechSamples/BLEPrint/issues"

# GUI entry point: `bleprint` launches the app (pip install . then run `bleprint`).
[project.gui-scripts]
bleprint = "gui:main"

[tool.setuptools]
py-modules = ["bleprint", "gui", "printers", "qrlabel", "supvan"]
